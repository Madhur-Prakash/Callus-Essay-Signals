# Development stack.
#
# The default `docker compose up` starts exactly what the application needs:
# MongoDB, the API and the frontend. Redis and Kafka are behind profiles because
# neither is required - see the comments on each service and docs/architecture.md.
#
#   docker compose up --build                    # mongodb + backend + frontend
#   docker compose --profile cache up --build    # ... plus redis
#   docker compose --profile queue up --build    # ... plus kafka + worker
#   docker compose --profile all up --build      # everything

services:
  mongodb:
    image: mongo:7
    container_name: essay-detector-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      # No credentials in the dev compose file on purpose: the port is bound to
      # localhost and there is nothing sensitive in a bootstrap corpus. For any
      # deployment, set MONGO_INITDB_ROOT_* and put the credentials in MONGODB_URL
      # via a secret, never in this file.
      MONGO_INITDB_DATABASE: ai_essay_detector
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essay-detector-api
    restart: unless-stopped
    ports:
      - '8000:8000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: ai_essay_detector
      SAVE_ESSAYS: 'false'
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
      REDIS_ENABLED: 'false'
      KAFKA_ENABLED: 'false'
      LM_MODEL_NAME: distilgpt2
    volumes:
      # Model artifacts and the corpus live on the host so training and serving
      # share them without a rebuild.
      - ./backend/ml/artifacts:/app/ml/artifacts
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      # Cache the HuggingFace download between container restarts.
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: essay-detector-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

  # --------------------------------------------------------------------- redis
  # Optional. Caches deterministic analysis results, which makes re-analysing a
  # draft while editing effectively free. Enable with `--profile cache` and set
  # REDIS_ENABLED=true on the backend.
  redis:
    image: redis:7-alpine
    container_name: essay-detector-redis
    restart: unless-stopped
    profiles: ['cache', 'all']
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------- kafka
  # Optional, and off by default for a reason: normal essays analyse in under two
  # seconds, so a queue would add latency and two failure modes for no benefit.
  # Enable with `--profile queue` when you actually have long-running work.
  kafka:
    image: bitnami/kafka:3.7
    container_name: essay-detector-kafka
    restart: unless-stopped
    profiles: ['queue', 'all']
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essay-detector-worker
    restart: unless-stopped
    profiles: ['queue', 'all']
    command: ['uv', 'run', 'python', '-m', 'app.workers.analysis_worker']
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      MONGODB_URL: mongodb://mongodb:27017
      KAFKA_ENABLED: 'true'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAVE_ESSAYS: 'false'
    volumes:
      - ./backend/ml/artifacts:/app/ml/artifacts
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - hf-cache:/root/.cache/huggingface

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  hf-cache:
