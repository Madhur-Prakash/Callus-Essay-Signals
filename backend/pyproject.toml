[project]
name = "ai-essay-detector-backend"
version = "1.0.0"
description = "Explainable AI-writing detector for college admissions essays (FastAPI + hybrid ML/NLP pipeline)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- web / api ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # --- persistence ---
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "redis>=5.2.0",
    # --- async messaging (optional at runtime, always importable) ---
    "aiokafka>=0.12.0",
    # --- logging ---
    "logifyx>=1.1.3",
    # --- ml / nlp ---
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "tokenizers>=0.19.0",
    "spacy>=3.8.0,<3.9.0",
    "en-core-web-sm",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0,<3",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    # --- misc ---
    "httpx>=0.27.0",
    "orjson>=3.10.0",
]

# A PEP 735 dependency group, not an optional extra, and deliberately so: uv
# installs the `dev` group by default, whereas an extra is opt-in - so a plain
# `uv run pytest` would re-sync the environment without it and uninstall pytest
# and ruff mid-session.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
# Keep torch on the CPU-only wheel index: the detector runs a small causal LM and
# does not need CUDA. This keeps the environment ~2GB smaller.
override-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests that load the language model or spaCy pipeline",
    "integration: marks tests that need MongoDB",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
